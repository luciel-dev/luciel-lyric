# Android APK. Separate from the desktop workflow so it does not share the macOS runner slot.
# arm64-v8a is the phone ABI. x86_64 is in the same APK so this job can boot an emulator.
name: build-android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already has the Android SDK. android-actions/setup-android@v3
      # still asks sdkmanager for the removed "tools" package and fails the job.
      - name: SDK, NDK, CMake
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found at $SDK"
            exit 1
          fi
          SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          echo "sdkmanager=$SM"
          mkdir -p "$SDK/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-license"
          "$SM" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Signing key
        env:
          LUCIEL_KEYSTORE_B64: ${{ secrets.LUCIEL_KEYSTORE_B64 }}
          LUCIEL_KEYSTORE_PASSWORD: ${{ secrets.LUCIEL_KEYSTORE_PASSWORD }}
          LUCIEL_KEY_PASSWORD: ${{ secrets.LUCIEL_KEY_PASSWORD }}
          LUCIEL_KEY_ALIAS: ${{ secrets.LUCIEL_KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=0
          for name in LUCIEL_KEYSTORE_B64 LUCIEL_KEYSTORE_PASSWORD LUCIEL_KEY_PASSWORD LUCIEL_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "Missing release secret ${name}."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ "${LUCIEL_KEY_ALIAS}" != "luciel" ]; then
            echo "LUCIEL_KEY_ALIAS must be luciel."
            exit 1
          fi
          printf '%s' "${LUCIEL_KEYSTORE_B64}" | base64 -d > android/ci.keystore
          keytool -list -keystore android/ci.keystore -storepass "${LUCIEL_KEYSTORE_PASSWORD}" > /tmp/luciel-store.txt
          store_type=$(awk -F': ' '/Keystore type/{print $2; exit}' /tmp/luciel-store.txt)
          if [ "$store_type" != "PKCS12" ]; then
            echo "Release keystore type is ${store_type}, expected PKCS12."
            exit 1
          fi
          if ! grep -q "luciel," /tmp/luciel-store.txt; then
            echo "Release keystore has no luciel alias."
            exit 1
          fi
          keytool -list -v -keystore android/ci.keystore -storepass "${LUCIEL_KEYSTORE_PASSWORD}" -alias luciel > /tmp/luciel-cert.txt
          if grep -E -q "CN=Android Debug|CN=Luciel Lyric CI" /tmp/luciel-cert.txt; then
            echo "Refusing a debug or throwaway signer."
            exit 1
          fi
          echo "Using the permanent PKCS12 release key (alias luciel)."
          echo "LUCIEL_KEYSTORE_PASSWORD=${LUCIEL_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "LUCIEL_KEY_PASSWORD=${LUCIEL_KEY_PASSWORD}" >> "$GITHUB_ENV"
          echo "LUCIEL_KEY_ALIAS=${LUCIEL_KEY_ALIAS}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Lyric timing checks
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++
          g++ -std=c++17 -I android/app/src/main/cpp android/scripts/merge_test.cpp -o /tmp/luciel-merge-test
          /tmp/luciel-merge-test fixture
          node android/scripts/lyricsync-test.mjs
          node android/scripts/layers-test.mjs

      - name: Assemble release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Whisper word times on a real clip
        run: bash android/scripts/whisper-words.sh

      - name: Publish a stable APK name
        run: |
          src=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          cp "$src" LucielLyric-android.apk
          ls -l LucielLyric-android.apk

      - name: Check the permanent signer
        env:
          LUCIEL_KEYSTORE_PASSWORD: ${{ secrets.LUCIEL_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs LucielLyric-android.apk | tee /tmp/luciel-apk-certs.txt
          if grep -E -q "Signer #2|CN=Android Debug|CN=Luciel Lyric CI" /tmp/luciel-apk-certs.txt; then
            echo "APK signer is not the single permanent release cert."
            exit 1
          fi
          ks=$(grep -m1 'SHA256:' /tmp/luciel-cert.txt | sed 's/.*SHA256: *//' | tr -d ' :' | tr 'A-F' 'a-f')
          apk=$(grep -m1 'SHA-256 digest' /tmp/luciel-apk-certs.txt | sed 's/.*: *//' | tr -d ' :' | tr 'A-F' 'a-f')
          if [ -z "$ks" ] || [ "$ks" != "$apk" ]; then
            echo "APK signer SHA-256 does not match the permanent keystore."
            exit 1
          fi
          pretty=$(printf '%s' "$ks" | sed 's/\(..\)/\1:/g; s/:$//' | tr 'a-f' 'A-F')
          echo "Permanent signer SHA-256: $pretty"
          {
            echo "### Permanent signer SHA-256"
            echo
            echo '```'
            echo "$pretty"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LucielLyric-android
          path: LucielLyric-android.apk
          if-no-files-found: error
          compression-level: 0

      - name: Prefetch system image
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          img='system-images;android-30;google_apis;x86_64'
          for try in 1 2 3; do
            "$SM" --sdk_root="$SDK" --install "$img" || true
            if [ -d "$SDK/system-images/android-30/google_apis/x86_64" ]; then
              echo "system image ready on try ${try}"
              exit 0
            fi
            rm -rf "$SDK/system-images/android-30" "$SDK/.downloadIntermediates" "$SDK/temp" "$SDK/.temp"
            sleep 3
          done
          echo "system image still missing"
          exit 1

      - name: Allow the emulator to use KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is missing, so the emulator would be pure software and too slow"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Emulator smoke + screenshots
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/scripts/smoke.sh

      # sdkmanager sometimes unpacks a corrupt system image ("unknown archive") and the
      # emulator never boots. Drop that zip so the retry downloads a fresh image.
      - name: Drop a corrupt system image
        if: steps.smoke.outcome == 'failure'
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          rm -rf "$sdk/system-images/android-30" "$sdk/.downloadIntermediates" "$sdk/temp" "$sdk/.temp"
          find "$sdk" -iname '*x86_64*android-30*' -delete || true
      - name: Retry emulator smoke
        if: steps.smoke.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: docs/screenshots/android-*.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload the APK only when the tag is the Android version
        id: gate
        shell: bash
        run: |
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          tag="${GITHUB_REF#refs/tags/v}"
          echo "android=$name tag=$tag"
          if [ "$name" = "$tag" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"; else echo "upload=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.upload == 'true'
        with:
          name: LucielLyric-android
          path: out
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.upload == 'true'
        continue-on-error: true
        with:
          name: android-screenshots
          path: shots
      - if: steps.gate.outputs.upload == 'true'
        run: |
          ls -la out
          if compgen -G "shots/*.png" > /dev/null; then cp shots/*.png out/; fi
          ls -la out
      - uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.upload == 'true'
        with:
          files: out/*
          draft: false
          prerelease: false
          body: |
            Luciel Lyric 1.5.5 — desktop and Android.

            Desktop is five guided steps: Audio, Sync lyrics, Video, Text, and Render. Synced word times stay locked, and typed words stay verbatim. Space plays and pauses outside a text field. Video resize, crop, trim, and extra captions live on the Video step and do not change lyric text, timings, or style. That step fills the window: the preview sits on the right, the picture controls fold into a side panel, and the multitrack timeline runs across the bottom. Drag the bar between them to resize it. The mascot stays in its own row under the controls.

            Android is six steps: Audio, Sync, Video, Look, Time, and Render. One numbered dock is the step list, and every step opens even when lyrics are not lined up yet. The preview and the play bar stack, and the picture stays large enough to see. Video resize handles are small corner marks with a 48dp hit area, and the timeline shows Video, Text, Lyrics, and Audio. Sync shows whether the Quick voice model is on the phone, downloading, or missing. Quick is inside the APK (74.1 MB, plus a 0.9 MB voice-activity file), so a fresh install can listen offline. The APK is about 98 MB instead of 23 MB. Clearer stays an optional download, with a progress bar and a retry. If the model is missing, tap Mark while the song plays. Skip sync goes straight to Video. Lyric text stays read-only on Video. Look sets the text. Time sets the zoom and the background. Typed lyrics are force-aligned on device. On the sung test clip the mean word-start error is 0.104 s, and 100% of words fall within 0.3 s (confidence 0.915).

            Screenshots cover every Android step in Aero, Y2K, and Winamp, plus the desktop sync and video panels.

            * Windows: run LucielLyric-Setup.exe (SmartScreen: More info > Run anyway), or unzip the portable zip and run LucielLyric.exe. No Python. Works offline, including vocal isolation.
            * macOS (Apple Silicon): open the .dmg, drag Luciel Lyric to Applications, then right-click > Open the first time
              (macOS 15+: System Settings > Privacy & Security > Open Anyway). The app is not notarized.
            * Android (arm64, Android 8+): install LucielLyric-android.apk over 1.5.4. The Quick voice model is in the APK. Clearer and the line-up file download once, then stay on the phone. Vocal isolation is desktop-only. This build is signed with the permanent release key. It installs over 1.5.4 with no uninstall. Later updates install over this one.

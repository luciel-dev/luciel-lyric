# Builds the stand-alone desktop apps (no Python needed on the user's machine):
#   Windows x64      -> LucielLyric-Setup.exe (Inno Setup) + LucielLyric-win-x64-portable.zip
#   macOS arm64      -> LucielLyric-mac-arm64.dmg ("Luciel Lyric.app", ad-hoc signed, not notarized)
# Intel macOS and Linux are not in this workflow. A matrix entry still requests its runner
# even when every step is skipped, and macos-15-intel is a scarce larger image.
# Every build is smoke-tested headless (frozen app, server-only, internet blocked): sync with vocal
# isolation + render via the HTTP API. On a v* tag the files are attached to a GitHub release.
name: build-desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 and macos-26 arm64 jobs were cancelled with
          # "not acquired by Runner of type hosted" (capacity). macos-14 is still
          # served until 2026-11-02; the next brownout starts 2026-10-23 14:00 UTC.
          - { name: windows-x64, os: windows-latest, vocals: true, enabled: true }
          - { name: macos-arm64, os: macos-14, vocals: true, enabled: true }
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      LUCIEL_NO_VOCALS: ${{ matrix.vocals && '0' || '1' }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Skip (optional build not requested)
        if: ${{ matrix.enabled != true && matrix.enabled != 'true' }}
        run: echo "skipped - enable it from 'Run workflow'"

      - uses: actions/checkout@v4
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}

      - uses: actions/setup-python@v5
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/requirements*.txt
            packaging/requirements-desktop.txt

      - name: Version
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}
        id: ver
        shell: bash
        run: |
          base=$(python -c "import sys; sys.path.insert(0,'.'); from app.version import __version__; print(__version__)")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$base"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "version $v"

      - name: Install Python dependencies
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          req=scripts/requirements.txt
          if [ "${{ matrix.name }}" = "macos-x86_64" ]; then
            # onnxruntime >= 1.24 ships no Intel-Mac wheels; 1.23.2 is the last one
            sed 's/^onnxruntime==.*/onnxruntime==1.23.2/' scripts/requirements.txt > /tmp/req-x64.txt; req=/tmp/req-x64.txt
          fi
          if [ "$LUCIEL_NO_VOCALS" != "1" ] && [ "$RUNNER_OS" != "macOS" ]; then
            # CPU-only torch (avoids the multi-GB CUDA build). Version is 2.14.1+cpu.
            python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -r "$req"
          if [ "$LUCIEL_NO_VOCALS" != "1" ]; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              python -m pip install -r scripts/requirements-vocals.txt
            else
              # requirements-vocals.txt pins torch==2.14.1, which does not match 2.14.1+cpu
              # and would replace the CPU wheel with the default PyPI build.
              grep -v '^torch==' scripts/requirements-vocals.txt > /tmp/req-vocals.txt
              python -m pip install -r /tmp/req-vocals.txt
            fi
          fi
          python -m pip install -r packaging/requirements-desktop.txt
          python -m pip uninstall -y static-ffmpeg twine || true
          python -c "import torch; print('torch', torch.__version__)" || true
          python -m pip list

      - name: Cache models
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            models/faster-whisper-base.en
            models/hf
          key: models-${{ hashFiles('scripts/fetch_models.py') }}-${{ matrix.vocals }}

      - name: Fetch models (checksum-verified)
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}
        shell: bash
        run: |
          if [ "$LUCIEL_NO_VOCALS" = "1" ]; then python scripts/fetch_models.py --no-vocals; python scripts/fetch_models.py --check --no-vocals
          else python scripts/fetch_models.py; python scripts/fetch_models.py --check; fi

      - name: Fetch static ffmpeg (pinned SHA-256)
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}
        run: python packaging/fetch_ffmpeg.py

      - name: Window helper tests
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}
        run: python scripts/test_desktop_window.py

      - name: Icons + version info
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}
        shell: bash
        run: |
          python packaging/make_icons.py
          python packaging/make_version_info.py --version "${{ steps.ver.outputs.version }}"

      - name: Bundle WebView2 bootstrapper
        if: ${{ runner.os == 'Windows' && (matrix.enabled == true || matrix.enabled == 'true') }}
        run: python packaging/fetch_webview2.py

      - name: PyInstaller
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}
        run: pyinstaller packaging/luciel_lyric.spec --noconfirm --distpath dist --workpath build/pyi

      # ---------- Windows ----------
      - name: Smoke test (Windows)
        if: ${{ runner.os == 'Windows' && (matrix.enabled == true || matrix.enabled == 'true') }}
        run: python packaging/ci_smoke.py --exe dist/LucielLyric/LucielLyric.exe
      - name: Native window (Windows)
        if: ${{ runner.os == 'Windows' && (matrix.enabled == true || matrix.enabled == 'true') }}
        timeout-minutes: 8
        run: python -u packaging/win_window_check.py --exe dist/LucielLyric/LucielLyric.exe --screenshot dist/windows-window.png
      - name: Upload Windows window screenshot
        if: ${{ !cancelled() && runner.os == 'Windows' && (matrix.enabled == true || matrix.enabled == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-window
          path: dist/windows-window.png
          if-no-files-found: ignore
      - name: Package (Windows installer + portable zip)
        if: ${{ runner.os == 'Windows' && (matrix.enabled == true || matrix.enabled == 'true') }}
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem -Path "${env:ProgramFiles(x86)}","${env:ProgramFiles}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup ISCC.exe not found" }
          Write-Host "Using $iscc"
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\..\dist\LucielLyric" packaging\windows\LucielLyric.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $seven = $null
          $cmd = Get-Command 7z -ErrorAction SilentlyContinue
          if ($cmd) { $seven = $cmd.Source } else { $seven = "${env:ProgramFiles}\7-Zip\7z.exe" }
          if (-not (Test-Path $seven)) { throw "7z not found" }
          & $seven a -tzip -mx=5 dist\LucielLyric-win-x64-portable.zip .\dist\LucielLyric
          if ($LASTEXITCODE -ne 0) { throw "7z failed ($LASTEXITCODE)" }
          Get-ChildItem dist\*.exe, dist\*.zip | Format-Table Name, Length

      # ---------- macOS ----------
      - name: Sign + dmg (macOS)
        if: ${{ runner.os == 'macOS' && (matrix.enabled == true || matrix.enabled == 'true') }}
        run: bash packaging/macos/make_dmg.sh "$(uname -m)"
      - name: Smoke test (macOS, signed app)
        if: ${{ runner.os == 'macOS' && (matrix.enabled == true || matrix.enabled == 'true') }}
        run: python packaging/ci_smoke.py --exe "dist/Luciel Lyric.app/Contents/MacOS/LucielLyric" ${{ matrix.vocals && ' ' || '--no-vocals' }}

      # ---------- Linux ----------
      - name: Smoke test (Linux, no network namespace)
        if: ${{ runner.os == 'Linux' && (matrix.enabled == true || matrix.enabled == 'true') }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get install -y -q iproute2 >/dev/null || true
          python packaging/ci_smoke.py --exe dist/LucielLyric/LucielLyric --netns
      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' && (matrix.enabled == true || matrix.enabled == 'true') }}
        run: tar -C dist -czf dist/LucielLyric-linux-x64.tar.gz LucielLyric

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.enabled == true || matrix.enabled == 'true' }}
        with:
          name: LucielLyric-${{ matrix.name }}
          path: |
            dist/LucielLyric-Setup.exe
            dist/LucielLyric-win-x64-portable.zip
            dist/LucielLyric-mac-*.dmg
            dist/LucielLyric-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  alignment:
    name: alignment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aligner dependencies
        run: python -m pip install --upgrade pip && python -m pip install "onnxruntime==1.31.0" "numpy==2.5.4" "rapidfuzz==3.14.6"
      - name: Cache the wav2vec2 aligner
        uses: actions/cache@v4
        with:
          path: data/models/wav2vec2-base-960h
          key: wav2vec2-base-960h-int8-a4249bb7
      - name: Forced alignment on the sung clip
        run: python scripts/test_sync.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, alignment]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out docs/screenshots
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/*.zip
            out/*.dmg
            out/*.tar.gz
            docs/screenshots/sync-v140.png
            docs/screenshots/sync-panel-y2k.png
            docs/screenshots/sync-panel-winamp.png
          draft: false
          prerelease: false
          body: |
            Luciel Lyric 1.5.0 — desktop lyric video editor.

            Five guided steps: Audio, Sync lyrics, Video, Text, and Render. Synced word times stay locked. Space plays and pauses outside a text field. Video resize, crop, trim, and extra captions live on the Video step and do not change lyric text, timings, or style.

            Android 1.4.3 is still in progress and is not this desktop release. If an Android APK is attached, it is the phone build already on this commit (versionName 1.4.2), not the 1.5.0 desktop editor.

            * Windows: run LucielLyric-Setup.exe (SmartScreen: More info > Run anyway), or unzip the portable zip and run LucielLyric.exe. No Python. Works offline, including vocal isolation.
            * macOS (Apple Silicon): open the .dmg, drag Luciel Lyric to Applications, then right-click > Open the first time
              (macOS 15+: System Settings > Privacy & Security > Open Anyway). The app is not notarized.
            * Android (arm64, Android 8+): install LucielLyric-android.apk. Same lyric looks and animations. The speech model (~75 MB, English) downloads the first time you sync; after that, sync and render stay on the phone. Vocal isolation is desktop-only. The 1.3.0 and 1.3.1 signing keys were not saved, and LUCIEL_KEYSTORE_B64 is not set, so this APK will not install over 1.3.0 or 1.3.1, or over the next build, until that secret (plus LUCIEL_KEYSTORE_PASSWORD, LUCIEL_KEY_PASSWORD, and LUCIEL_KEY_ALIAS) is added. Uninstall the previous copy first.
